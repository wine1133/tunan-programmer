<svg xmlns="http://www.w3.org/2000/svg" width="750" height="260" viewBox="0 0 750 260" role="img" aria-label="Java 全栈开发">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3489ff">
        <animate attributeName="stop-color" values="#3489ff;#6d5dfc;#3489ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#152d78"/>
    </linearGradient>
    <radialGradient id="glow2"><stop offset="0%" stop-color="#9ed6ff" stop-opacity=".7"/><stop offset="100%" stop-color="#9ed6ff" stop-opacity="0"/></radialGradient>
    <filter id="blur2"><feGaussianBlur stdDeviation="18"/></filter>
    <clipPath id="clip2"><rect width="750" height="260" rx="26"/></clipPath>
    <style>
      .orbit1{animation:orbit1 9s ease-in-out infinite}.orbit2{animation:orbit2 7s ease-in-out infinite}.code{animation:code 4s ease-in-out infinite}
      .spark{animation:spark 2.8s ease-in-out infinite}.spark2{animation:spark 2.8s ease-in-out infinite 1.2s}
      @keyframes orbit1{0%,100%{transform:translate(0,0)}50%{transform:translate(-24px,18px)}}
      @keyframes orbit2{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(24px,-16px) rotate(180deg)}}
      @keyframes code{0%,100%{transform:translate(0,0)}50%{transform:translate(0,-10px)}}
      @keyframes spark{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
    </style>
  </defs>
  <g clip-path="url(#clip2)">
    <rect width="750" height="260" rx="26" fill="url(#bg2)"/>
    <circle cx="640" cy="52" r="165" fill="url(#glow2)" filter="url(#blur2)" class="orbit1"/>
    <circle cx="80" cy="255" r="160" fill="#fff" opacity=".06" class="orbit2"/>
    <g transform="translate(596 124)" class="orbit2">
      <circle r="72" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>
      <circle r="49" fill="none" stroke="#fff" stroke-opacity=".24" stroke-width="2" stroke-dasharray="6 12"/>
      <circle r="25" fill="#fff" opacity=".14"/>
    </g>
    <g class="code">
      <rect x="530" y="65" width="154" height="112" rx="18" fill="#0b1c52" opacity=".42" stroke="#fff" stroke-opacity=".24"/>
      <text x="554" y="105" font-family="Consolas, monospace" font-size="22" fill="#fff" opacity=".9">&lt;/&gt;</text>
      <rect x="554" y="122" width="76" height="6" rx="3" fill="#fff" opacity=".35"/>
      <rect x="554" y="138" width="104" height="6" rx="3" fill="#fff" opacity=".25"/>
      <rect x="554" y="154" width="60" height="6" rx="3" fill="#fff" opacity=".25"/>
    </g>
    <g fill="#fff">
      <circle cx="455" cy="48" r="4" class="spark"/>
      <circle cx="705" cy="195" r="3.5" class="spark2"/>
      <circle cx="500" cy="214" r="2.8" class="spark2"/>
    </g>
    <rect x="50" y="54" width="142" height="34" rx="17" fill="#fff" opacity=".2"/>
    <text x="121" y="76" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#fff">热门就业方向</text>
    <text x="50" y="154" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="43" font-weight="700" fill="#fff">Java 全栈开发</text>
    <text x="52" y="205" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" fill="#fff" opacity=".88">基础 · 框架 · 项目 · 就业</text>
    <rect x="52" y="222" width="152" height="42" rx="21" fill="#fff" opacity=".95"/>
    <text x="128" y="249" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="600" fill="#2153bb">查看课程</text>
    <path d="M-160 0 L0 260 L100 260 L-60 0 Z" fill="#fff" opacity=".07">
      <animateTransform attributeName="transform" type="translate" values="0 0;900 0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>