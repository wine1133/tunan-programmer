<svg xmlns="http://www.w3.org/2000/svg" width="750" height="260" viewBox="0 0 750 260" role="img" aria-label="人工智能与大数据">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9a3d">
        <animate attributeName="stop-color" values="#ff9a3d;#ff5b78;#ff9a3d" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7c3bd6"/>
    </linearGradient>
    <radialGradient id="glow3"><stop offset="0%" stop-color="#ffe7a8" stop-opacity=".72"/><stop offset="100%" stop-color="#ffe7a8" stop-opacity="0"/></radialGradient>
    <filter id="blur3"><feGaussianBlur stdDeviation="18"/></filter>
    <clipPath id="clip3"><rect width="750" height="260" rx="26"/></clipPath>
    <style>
      .wave{animation:wave 7s ease-in-out infinite}.wave2{animation:wave 9s ease-in-out infinite reverse}.brain{animation:brain 5s ease-in-out infinite}
      .dot{animation:dot 3s ease-in-out infinite}.dot2{animation:dot 3s ease-in-out infinite 1.4s}.rotate{transform-origin:630px 128px;animation:rotate 14s linear infinite}
      @keyframes wave{0%,100%{transform:translateX(0)}50%{transform:translateX(-26px)}}
      @keyframes brain{0%,100%{transform:translate(0,0)}50%{transform:translate(-8px,-12px)}}
      @keyframes dot{0%,100%{opacity:.28;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
      @keyframes rotate{to{transform:rotate(360deg)}}
    </style>
  </defs>
  <g clip-path="url(#clip3)">
    <rect width="750" height="260" rx="26" fill="url(#bg3)"/>
    <circle cx="655" cy="40" r="175" fill="url(#glow3)" filter="url(#blur3)" class="brain"/>
    <circle cx="90" cy="275" r="170" fill="#fff" opacity=".07" class="wave2"/>
    <g class="wave" opacity=".24" fill="none" stroke="#fff" stroke-width="2">
      <path d="M360 192 C430 130 490 250 560 170 S690 90 820 175"/>
      <path d="M350 218 C430 158 500 268 575 192 S700 120 830 200"/>
    </g>
    <g transform="translate(622 128)" class="brain">
      <g class="rotate">
        <circle r="70" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="2" stroke-dasharray="10 15"/>
        <circle r="50" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="2"/>
      </g>
      <path d="M-30 8c-8-10-6-26 5-34-2-13 8-24 21-23 7-12 24-13 33-3 13-4 27 4 30 17 13 4 18 19 10 30 8 11 3 27-10 32-7 13-25 15-35 5-7 6-17 7-26 3-12 5-26-3-28-15-10 0-18-6-20-15z" fill="#fff" opacity=".16" stroke="#fff" stroke-opacity=".46"/>
      <g stroke="#fff" stroke-opacity=".62" stroke-width="2" fill="none">
        <path d="M-18 0h19M2-18v13M5 3l15 12M20-18l-13 12M22 0h18"/>
      </g>
      <g fill="#fff">
        <circle cx="-18" cy="0" r="4" class="dot"/><circle cx="2" cy="-18" r="4" class="dot2"/><circle cx="5" cy="3" r="4" class="dot2"/><circle cx="20" cy="-18" r="4" class="dot"/><circle cx="40" cy="0" r="4" class="dot"/>
      </g>
    </g>
    <rect x="50" y="54" width="126" height="34" rx="17" fill="#fff" opacity=".2"/>
    <text x="113" y="76" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#fff">前沿技术课程</text>
    <text x="50" y="154" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="42" font-weight="700" fill="#fff">AI 与大数据</text>
    <text x="52" y="205" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" fill="#fff" opacity=".9">从数据分析到智能工程实践</text>
    <rect x="52" y="222" width="152" height="42" rx="21" fill="#fff" opacity=".95"/>
    <text x="128" y="249" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="600" fill="#b5484e">探索课程</text>
    <path d="M-180 0 L-20 260 L80 260 L-80 0 Z" fill="#fff" opacity=".08">
      <animateTransform attributeName="transform" type="translate" values="0 0;900 0" dur="6.5s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>